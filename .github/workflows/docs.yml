name: Build Docs Page

on:
  workflow_dispatch:
  push:
    branches: [coui17]
    paths:
      - "docs/**"
      - "coui-ui/src/**"
      - "coui-preference/src/**"
      - "example/shared/src/**"
      - "example/web/src/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build Docs
        # One short-lived Gradle JVM per step that compiles Kotlin in-process: a long-lived daemon
        # plus a Kotlin daemon kept growing across the steps until the runner ran out of memory
        # during the Wasm optimization of the example app.
        env:
          GRADLE: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          $GRADLE :coui-ui:dokkaGenerate -Prelease
          mkdir -p ./docs/public/dokka
          mv ./coui-ui/build/dokka/html/* ./docs/public/dokka
          $GRADLE :docs:demo:jsBrowserDistribution
          mkdir -p ./docs/public/compose
          mv ./docs/demo/build/dist/js/productionExecutable/* ./docs/public/compose
          $GRADLE :example:web:wasmJsBrowserDistribution
          mkdir -p ./docs/public/example
          mv ./example/web/build/dist/wasmJs/productionExecutable/* ./docs/public/example
          $GRADLE :docs:canvas:wasmJsBrowserDistribution
          mkdir -p ./docs/public/canvas
          mv ./docs/canvas/build/dist/wasmJs/productionExecutable/* ./docs/public/canvas
          $GRADLE :docs:iconGen:generateIcons
          cd ./docs
          yarn install
          yarn docs:build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
