<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="color-scheme" content="light dark">
    <title>COUI Canvas</title>
    <link rel="icon" href="icon.webp">
    <meta name="description" content="Sketch ColorOS 17 screens with real COUI components and turn them into a prompt or Kotlin code.">
    <link rel="stylesheet" href="loading.css">
    <style>
        :root { --loading-bg: #f4f5f8; }
        @media (prefers-color-scheme: dark) { :root { --loading-bg: #161616; } }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--loading-bg); }
        #canvasApp { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="loading">
    <img id="loading-logo" src="icon.webp" alt="">
    <div id="loading-track"><div id="loading-bar"></div></div>
    <div id="loading-text"></div>
    <div id="loading-log" aria-live="polite"></div>
</div>
<div id="canvasApp"></div>
<script src="loading.js" data-app="canvas.js" data-modules="2" data-guess-bytes="7000000"></script>
</body>
</html>
